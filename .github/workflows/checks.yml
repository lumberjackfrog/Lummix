name: Lummix checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo test --locked --manifest-path windows/controls-rs/Cargo.toml --target-dir .build/controls
      - run: python windows/controls-rs/build_controls.py
      - run: python -m pip install -r tests/ui/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests/ui -v
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Prepare backend test environment
        shell: pwsh
        run: |
          python -m venv .venv
          ./.venv/Scripts/python.exe -m pip install -r windows/requirements-test.txt
          ./.venv/Scripts/python.exe -m playwright install chromium
      - shell: pwsh
        run: ./scripts/test-windows.ps1
      - name: Fetch the pre-Rust mixer for independent verification
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: bc24de404252e4af8d2ea3cc5b4797cadd135ff7
          path: .build/original
          persist-credentials: false
      - name: Replay and time the Windows audio callback
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: ./scripts/replay-dsp.ps1 -Python ./.venv/Scripts/python.exe -Original ./.build/original/windows/cable_mixer.py
      - name: Fetch the previous shipped-source mixer for routing comparison
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: c8a5a2dcc3539de864ef8662f87c7172a9bf70e3
          path: .build/previous
          persist-credentials: false
      - name: Compare process packet delivery and the duplex callback
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          cargo build --release --locked --manifest-path .build/previous/windows/dsp/Cargo.toml --target-dir .build/previous/.build/dsp
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --release --locked --features replay --manifest-path windows/dsp/Cargo.toml --target-dir .build/dsp-replay
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:PYTHONPATH = (Resolve-Path windows).Path
          ./.venv/Scripts/python.exe -B windows/tests/route_replay.py --baseline .build/previous --output .build/qa/route-comparison --blocks 60000
      - name: Save audio timing and replay evidence
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audio-verification
          include-hidden-files: true
          path: |
            .build/qa/dsp-benchmark.json
            .build/qa/route-comparison/route-benchmark.json
            .build/qa/dsp-replay/rust/app-cases/
      - name: Test XSOverlay add-on installation and removal
        env:
          LUMMIX_HOST_DLL: ${{ github.workspace }}/.build/host/release/lummix_host.dll
        shell: pwsh
        run: ./.venv/Scripts/python.exe -m unittest discover -s tests -p test_xsoverlay_install.py -v
      - name: Test Windows Installer rollback and retry
        shell: pwsh
        run: ./.venv/Scripts/python.exe -B windows/tests/verify_installer_rollback.py
      - name: Save failed rollback test logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rollback-logs
          path: .build/qa/rollback-*.log
          if-no-files-found: ignore
