name: Check published Windows setup

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag or candidate version, for example v1.0.5
        type: string
        required: true
      build_run:
        description: Optional successful Windows installer workflow run from the selected ref
        type: string
      candidate_sha256:
        description: SHA-256 printed by that build when testing a candidate
        type: string
      first_driver:
        description: Exercise the first-time VB-CABLE and standard-user Spotify installs on the disposable Windows VM
        type: boolean
        default: false
      upgrade_from:
        description: Optional earlier published version to install and configure before upgrading
        type: string

permissions:
  contents: read
  actions: read

jobs:
  install:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      UPGRADE_FROM: ${{ inputs.upgrade_from }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download and check the exact installer
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
        run: |
          if ($env:RELEASE_TAG -cnotmatch '\Av[0-9]+\.[0-9]+\.[0-9]+\z') { throw 'Expected a release tag such as v1.0.2.' }
          $version = [version]$env:RELEASE_TAG.Substring(1)
          $dest = Join-Path $env:RUNNER_TEMP 'lummix-release'
          New-Item -ItemType Directory -Path $dest | Out-Null
          $setup = Join-Path $dest 'Lummix.Setup.exe'
          $ref = "refs/tags/$env:RELEASE_TAG"
          $source = 'Published release'
          function Get-PublishedChecksum([string]$Tag, [string]$Folder) {
            gh release download $Tag --repo $env:GITHUB_REPOSITORY --dir $Folder --pattern Lummix.Setup.exe --pattern SHA256SUMS.txt
            if ($LASTEXITCODE -ne 0) { throw "Could not download the installer and checksum for $Tag." }
            $line = [IO.File]::ReadAllText((Join-Path $Folder 'SHA256SUMS.txt'))
            if ($line -cnotmatch '\A([a-fA-F0-9]{64})  Lummix\.Setup\.exe(?:\r?\n)?\z') { throw "Invalid checksum file for $Tag." }
            return $Matches[1]
          }
          if ($env:BUILD_RUN) {
            if ($env:BUILD_RUN -cnotmatch '\A[0-9]+\z' -or $env:CANDIDATE_SHA256 -cnotmatch '\A[0-9a-fA-F]{64}\z') {
              throw 'Provide a Windows installer workflow run ID and its installer SHA-256.'
            }
            $runJson = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BUILD_RUN"
            if ($LASTEXITCODE -ne 0) { throw 'Could not read the candidate build run.' }
            $run = $runJson | ConvertFrom-Json
            if ($run.path -ne '.github/workflows/windows-installer.yml' -or $run.conclusion -ne 'success' -or $run.head_sha -ne $env:GITHUB_SHA) {
              throw 'Use a successful Windows installer workflow run for the selected commit.'
            }
            gh run download $env:BUILD_RUN --repo $env:GITHUB_REPOSITORY --dir $dest --name Lummix-Windows-x64
            if ($LASTEXITCODE -ne 0) { throw 'Could not download the candidate installer artifact.' }
            Move-Item -LiteralPath (Join-Path $dest 'Lummix Setup.exe') -Destination $setup
            $expected = $env:CANDIDATE_SHA256
            $ref = $run.head_sha
            $source = "Candidate from build run $env:BUILD_RUN"
          } else {
            if ($env:CANDIDATE_SHA256) { throw 'A candidate SHA-256 requires a build run ID.' }
            $expected = Get-PublishedChecksum $env:RELEASE_TAG $dest
          }
          $actual = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'The tested installer does not match the expected SHA-256.' }
          if ($env:UPGRADE_FROM) {
            if ($env:UPGRADE_FROM -cnotmatch '\Av[0-9]+\.[0-9]+\.[0-9]+\z') { throw 'Invalid upgrade baseline tag.' }
            $priorVersion = [version]$env:UPGRADE_FROM.Substring(1)
            if ($priorVersion -lt [version]'1.0.5' -or $priorVersion -ge $version -or $version -lt [version]'1.0.6') {
              throw 'The upgrade test needs an earlier release with saved-profile support and a target of 1.0.6 or later.'
            }
            $priorDir = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'lummix-prior')
            $priorHash = Get-PublishedChecksum $env:UPGRADE_FROM $priorDir.FullName
            if ((Get-FileHash -LiteralPath (Join-Path $priorDir.FullName 'Lummix.Setup.exe')).Hash -ne $priorHash) {
              throw 'The previous installer did not match its published SHA-256.'
            }
          }
          $signature = (Get-AuthenticodeSignature -LiteralPath $setup).Status
          "$source $env:RELEASE_TAG — SHA-256 $actual — Authenticode $signature" >> $env:GITHUB_STEP_SUMMARY
          "ref=$ref" >> $env:GITHUB_OUTPUT
          "runtime=$(($version -ge [version]'1.0.5').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: steps.package.outputs.runtime == 'true'
        with:
          ref: ${{ steps.package.outputs.ref }}
          persist-credentials: false
      # Keep release-specific runtime fixtures pinned. A maintainer can use the current
      # UI test to verify the original public installer without replacing the release.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: github.event_name == 'workflow_dispatch' && !inputs.build_run && steps.package.outputs.runtime == 'true'
        with:
          ref: ${{ github.sha }}
          path: qa-harness
          sparse-checkout: windows/tests
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: inputs.upgrade_from != ''
        with:
          ref: refs/tags/${{ inputs.upgrade_from }}
          path: prior-source
          sparse-checkout: windows
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        if: steps.package.outputs.runtime == 'true'
        with:
          python-version: '3.12'
      - name: Prepare installed runtime verification
        if: steps.package.outputs.runtime == 'true'
        run: |
          python -m pip install --only-binary=:all: -r windows/requirements-test.txt

      - name: Verify the publisher signature on the public download
        if: steps.package.outputs.runtime == 'true' && !inputs.build_run
        run: |
          if ([version]$env:RELEASE_TAG.Substring(1) -ge [version]'1.0.8') {
            $env:PYTHONPATH = "$(Join-Path $PWD 'windows');$(Join-Path $PWD 'windows/runtime')"
            python -B windows/tests/verify_published_update.py $env:RELEASE_TAG (Join-Path $env:RUNNER_TEMP 'lummix-release/Lummix.Setup.exe')
            if ($LASTEXITCODE -ne 0) { throw 'Public update signature or downloaded installer did not verify.' }
          }

      - name: Install, verify, repair and uninstall
        env:
          VERIFY_RUNTIME: ${{ steps.package.outputs.runtime }}
          FIRST_DRIVER: ${{ inputs.first_driver }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          if ([version]$version -ge [version]'1.0.7') {
            Start-Service AudioEndpointBuilder
            Start-Service Audiosrv
          }
          $setup = Join-Path $env:RUNNER_TEMP 'lummix-release/Lummix.Setup.exe'
          $exe = Join-Path $env:LOCALAPPDATA "Programs/Lummix/$version/Lummix.exe"
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'Lummix/Lummix.lnk'
          $shortcuts = @($shortcut)
          if ([version]$version -ge [version]'1.0.3') {
            $desktop = Join-Path ([Environment]::GetFolderPath('DesktopDirectory')) 'Lummix.lnk'
            $shortcuts += $desktop
          }
          $cacheDir = Join-Path $env:LOCALAPPDATA 'Lummix/Installer'
          if (Test-Path -LiteralPath (@($exe, $cacheDir) + $shortcuts) | Where-Object { $_ }) { throw 'Expected a fresh runner.' }
          $shell = New-Object -ComObject WScript.Shell
          function Assert-Shortcut([string]$Path, [string]$ExpectedTarget = $exe) {
            if (!(Test-Path -LiteralPath $Path -PathType Leaf)) { throw "Shortcut missing: $Path" }
            $target = $shell.CreateShortcut($Path).TargetPath
            if ($target -ne $ExpectedTarget) { throw "Unexpected shortcut target: $target" }
          }
          function Test-InstalledRuntime {
            if ($env:VERIFY_RUNTIME -eq 'true') {
              python -B windows/tests/test_runtime.py --installed-exe $exe
              if ($LASTEXITCODE -ne 0) { throw 'Installed runtime verification failed.' }
              $report = Get-Content -Raw -LiteralPath .build/qa/verified-runtime.json | ConvertFrom-Json
              if ($report.mediaCapabilities -notcontains 'spotify-process-mix-v1') { throw 'Installed process capture capability is missing.' }
              "Checked the source content and byte-exact HTTP responses of $($report.studioAssetsExact) installed studio assets. Spotify status was $($report.spotify.state) and capture was $($report.readOnlyMic.spotifyCapture)." >> $env:GITHUB_STEP_SUMMARY
              if ($report.studioAssetsWithDifferentLineEndings) {
                "$($report.studioAssetsWithDifferentLineEndings.Count) assets differed from the checkout only in line endings." >> $env:GITHUB_STEP_SUMMARY
              }
              if ($report.spotifyArtworkPixels) {
                "Spotify artwork decoded at $($report.spotifyArtworkPixels -join ' × ') pixels." >> $env:GITHUB_STEP_SUMMARY
              } else {
                'The runner returned no Spotify artwork to decode.' >> $env:GITHUB_STEP_SUMMARY
              }
            } else {
              $verifier = Start-Process -FilePath $exe -ArgumentList 'verify-vendor' -WindowStyle Hidden -Wait -PassThru
              if ($verifier.ExitCode -ne 0) { throw "Packaged vendor verification exited $($verifier.ExitCode)." }
            }
          }
          if ($env:VERIFY_RUNTIME -eq 'true') {
            $env:PYTHONPATH = "$(Join-Path $PWD 'windows');$(Join-Path $PWD 'windows/runtime')"
          }
          $cycles = 1
          if ([version]$version -ge [version]'1.0.6') {
            $cycles = 3
            $qa = (New-Item -ItemType Directory -Force -Path .build/qa).FullName
            $profile = Join-Path $env:LOCALAPPDATA 'LumMix'
            $phases = @('seed', 'preserved', 'recover')
          }
          if ($env:UPGRADE_FROM) {
            $priorVersion = $env:UPGRADE_FROM.Substring(1)
            $priorExe = Join-Path $env:LOCALAPPDATA "Programs/Lummix/$priorVersion/Lummix.exe"
            $priorSetup = Join-Path $env:RUNNER_TEMP 'lummix-prior/Lummix.Setup.exe'
            $priorInstall = Start-Process -FilePath $priorSetup -ArgumentList '/S' -WindowStyle Hidden -Wait -PassThru
            if ($priorInstall.ExitCode -ne 0 -or !(Test-Path -LiteralPath $priorExe)) { throw 'Previous install failed.' }
            foreach ($path in $shortcuts) { Assert-Shortcut $path $priorExe }
            $priorCache = @(Get-ChildItem -LiteralPath $cacheDir -Filter Lummix.msi -File -Recurse)
            if ($priorCache.Count -ne 1) { throw 'Expected one previous MSI.' }
            $priorProduct = [guid]::ParseExact($priorCache[0].Directory.Name,'B').ToString('B')
            $msi = New-Object -ComObject WindowsInstaller.Installer
            if ($msi.ProductState($priorProduct) -ne 5) { throw 'Previous MSI is not registered.' }
            # Check each packaged helper against the capabilities for its own tag.
            $targetImports = $env:PYTHONPATH
            $env:PYTHONPATH = "$(Join-Path $PWD 'prior-source/windows');$(Join-Path $PWD 'prior-source/windows/runtime')"
            try {
              python -B windows/tests/test_runtime.py --installed-exe $priorExe --profile-phase seed
              if ($LASTEXITCODE -ne 0) { throw 'Previous release could not save the test profile.' }
            } finally { $env:PYTHONPATH = $targetImports }
            $phases[0] = 'preserved'
            if ([version]$version -ge [version]'1.0.7') {
              # A pre-1.0.7 user could already have registered the old executable by hand.
              $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
              New-Item -Path $runKey -ErrorAction SilentlyContinue | Out-Null
              New-ItemProperty -Path $runKey -Name Lummix -Value ('"{0}"' -f $priorExe) -PropertyType String -Force | Out-Null
            }
          }
          for ($cycle = 1; $cycle -le $cycles; $cycle++) {
            $arguments = '/S'
            if ($cycle -eq 1 -and [version]$version -ge [version]'1.0.8') {
              $oldHost = Start-Process -FilePath pwsh -ArgumentList '-NoProfile -Command Start-Sleep -Seconds 5' -WindowStyle Hidden -PassThru
              $arguments += " /LUMMIXWAITPID=$($oldHost.Id)"
            }
            $result = Start-Process -FilePath $setup -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
            if ($oldHost -and !$oldHost.HasExited) { throw 'Installer returned while the previous host was still running.' }
            if ($result.ExitCode -ne 0) { throw "Setup cycle $cycle exited $($result.ExitCode)." }
            $cache = @(Get-ChildItem -LiteralPath $cacheDir -Filter Lummix.msi -File -Recurse)
            if ($cache.Count -ne 1) { throw 'Expected exactly one registered MSI repair source.' }
            $product = [guid]::ParseExact($cache[0].Directory.Name,'B').ToString('B')
            try {
              if (!(Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Installed executable is missing.' }
              foreach ($path in $shortcuts) { Assert-Shortcut $path }
              $exeHash = (Get-FileHash -LiteralPath $exe).Hash
              if ($cycle -eq 1) {
                $firstExeHash = $exeHash
                $firstProduct = $product
                if ($env:UPGRADE_FROM) {
                  if ((Test-Path -LiteralPath $priorExe) -or (Test-Path -LiteralPath $priorCache[0].FullName) -or
                      $msi.ProductState($priorProduct) -eq 5 -or $msi.ProductState($product) -ne 5) {
                    throw 'The upgrade did not replace the previous Windows Installer product.'
                  }
                }
                if ($desktop) {
                  Remove-Item -LiteralPath $desktop
                  $repair = Start-Process -FilePath $setup -ArgumentList '/S' -WindowStyle Hidden -Wait -PassThru
                  if ($repair.ExitCode -ne 0) { throw "Repair exited $($repair.ExitCode)." }
                  foreach ($path in $shortcuts) { Assert-Shortcut $path }
                }
                Test-InstalledRuntime
                if ([version]$version -ge [version]'1.0.7') {
                  $startupArgs = @()
                  if ($env:UPGRADE_FROM) { $startupArgs += '--upgraded' }
                  $nativeTest = 'windows/tests/verify_sign_in.py'
                  if ([version]$version -ge [version]'1.0.8') {
                    if (Test-Path -LiteralPath "qa-harness/$nativeTest") { $nativeTest = "qa-harness/$nativeTest" }
                    $startupArgs += '--with-updates'
                  }
                  python -B $nativeTest $exe @startupArgs
                  if ($LASTEXITCODE -ne 0) { throw 'Installed native Settings verification failed.' }
                }
              } elseif ($exeHash -ne $firstExeHash -or $product -ne $firstProduct) {
                throw 'Reinstall changed the launcher hash or MSI product.'
              }
              if ($cycles -gt 1) {
                $phase = $phases[$cycle - 1]
                python -B windows/tests/test_runtime.py --installed-exe $exe --profile-phase $phase
                if ($LASTEXITCODE -ne 0) { throw "Settings check failed in cycle $cycle." }
                $saved = Get-Content -Raw -LiteralPath (Join-Path $qa "profile-$phase.json") | ConvertFrom-Json -AsHashtable
                if ($env:UPGRADE_FROM -and $cycle -eq 1) {
                  @{from=$env:UPGRADE_FROM; to=$env:RELEASE_TAG; shortcuts=$shortcuts.Count; previousProductRemoved=$true;
                    preferences=$saved.preferences; gains=$saved.gains; launcherSha256=$exeHash} |
                    ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $qa 'upgrade.json')
                  "In-place upgrade from $env:UPGRADE_FROM preserved the saved mixer values and replaced both shortcuts." >> $env:GITHUB_STEP_SUMMARY
                }
                if ($cycle -eq $cycles -and $env:FIRST_DRIVER -eq 'true') {
                  Start-Service AudioEndpointBuilder
                  Start-Service Audiosrv
                  python -B windows/tests/verify_first_driver.py $exe
                  if ($LASTEXITCODE -ne 0) { throw 'First-install driver test failed.' }
                  'Installed the original VB-Audio driver and verified that restarting Lummix preserved its pending Windows restart.' >> $env:GITHUB_STEP_SUMMARY
                }
              }
            } finally {
              if ($cycle -eq $cycles -and [version]$version -ge [version]'1.0.7') {
                $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
                New-ItemProperty -Path $runKey -Name Lummix -Value ('"{0}" --startup' -f $exe) -PropertyType String -Force | Out-Null
              }
              $arguments = "/x $product /qn /norestart"
              if ($cycles -gt 1) {
                $arguments += ' /l*v "{0}"' -f (Join-Path $qa "msi-uninstall-$cycle.log")
              }
              $removed = Start-Process msiexec.exe -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
              if ($removed.ExitCode -ne 0) { throw "Uninstall cycle $cycle exited $($removed.ExitCode)." }
            }
            if (Test-Path -LiteralPath (@($exe, $cache[0].FullName) + $shortcuts) | Where-Object { $_ }) { throw 'Uninstall left a release file behind.' }
            if ([version]$version -ge [version]'1.0.7' -and
                $null -ne [Microsoft.Win32.Registry]::GetValue('HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run','Lummix',$null)) {
              throw 'Uninstall left an automatic Lummix launch behind.'
            }
            if ($cycles -gt 1) {
              foreach ($name in $saved.settingsHashes.Keys) {
                $hash = (Get-FileHash -LiteralPath (Join-Path $profile $name)).Hash
                if ($hash -ne $saved.settingsHashes[$name]) { throw "Uninstall changed $name in cycle $cycle." }
              }
              $saved.cycle = $cycle
              $saved.launcherSha256 = $exeHash
              $saved.uninstallVerified = $true
              $saved | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $qa "profile-$phase.json")
            }
          }
          "Installed and uninstalled $version $cycles time(s), checked $($shortcuts.Count) shortcuts and verified the bundled driver package." >> $env:GITHUB_STEP_SUMMARY
          if ($cycles -gt 1) {
            'Each uninstall preserved app settings, gains, and their backup byte for byte. The final cycle restored a corrupt primary settings file from backup.' >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Install Spotify from the desktop setup control as a new standard user
        if: ${{ !cancelled() && inputs.first_driver && steps.package.outcome == 'success' }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          if ([version]$version -ge [version]'1.0.9') {
            ./windows/tests/verify_first_spotify.ps1 -Version $version -Setup (Join-Path $env:RUNNER_TEMP 'lummix-release/Lummix.Setup.exe')
          }

      - name: Open the mixer from the Desktop and Start menu
        if: inputs.upgrade_from != ''
        shell: python
        run: |
          import ctypes
          import json
          import os
          from pathlib import Path
          import subprocess
          import time

          import psutil
          import win32con
          import win32gui
          import win32process
          from win32com.shell import shell, shellcon

          user32 = ctypes.windll.user32
          user32.SetProcessDpiAwarenessContext(ctypes.c_void_p(-4))
          local = Path(os.environ["LOCALAPPDATA"])
          version = os.environ["RELEASE_TAG"].removeprefix("v")
          exe = local / "Programs" / "Lummix" / version / "Lummix.exe"
          setup = Path(os.environ["RUNNER_TEMP"]) / "lummix-release" / "Lummix.Setup.exe"
          links = {"Desktop": (shellcon.CSIDL_DESKTOPDIRECTORY, "Lummix.lnk"),
                   "Start": (shellcon.CSIDL_PROGRAMS, "Lummix/Lummix.lnk")}
          subprocess.run([str(setup), "/S"], check=True, timeout=120)
          msi, = (local / "Lummix" / "Installer").glob("*/Lummix.msi")
          launched = {}
          try:
              for location, (folder, filename) in links.items():
                  shortcut = Path(shell.SHGetFolderPath(0, folder, None, 0)) / filename
                  os.startfile(shortcut)
                  deadline = time.monotonic() + 45
                  while time.monotonic() < deadline:
                      hwnd = win32gui.FindWindow("LumMixStudioHost", None)
                      if hwnd and win32gui.IsWindowVisible(hwnd):
                          classes = []
                          win32gui.EnumChildWindows(hwnd, lambda child, _: classes.append(win32gui.GetClassName(child)) or True, None)
                          if any("Chrome" in name for name in classes):
                              break
                      time.sleep(.2)
                  else:
                      raise RuntimeError(f"{location} shortcut did not open a visible mixer window")
                  pid = win32process.GetWindowThreadProcessId(hwnd)[1]
                  process = psutil.Process(pid)
                  assert Path(process.exe()) == exe and win32gui.GetWindowText(hwnd) == "Lummix"
                  width, height = win32gui.GetClientRect(hwnd)[2:]
                  assert width > 0 and height > 0
                  left, top, right, bottom = win32gui.GetWindowRect(hwnd)
                  launched[location] = {"pid": pid, "visibleClient": [width, height],
                                        "nativeWindow": [right - left, bottom - top],
                                        "maximized": bool(user32.IsZoomed(hwnd)), "webViewAttached": True}
                  win32gui.PostMessage(hwnd, win32con.WM_COMMAND, 0x7140, 0)
                  assert process.wait(30) == 0, f"{location} mixer exited with an error"
              report = Path(".build/qa/shortcut-launch.json")
              report.write_text(json.dumps(launched, indent=2) + "\n", encoding="utf-8")
              print(launched)
              for window in launched.values():
                  if not window["maximized"]:
                      assert window["visibleClient"] == window["nativeWindow"], "The restored window has a frame inset"
              assert launched["Desktop"]["visibleClient"] == launched["Start"]["visibleClient"], "Reopening changed the mixer size"
          finally:
              subprocess.run(["msiexec.exe", "/x", msi.parent.name, "/qn", "/norestart"], check=True, timeout=120)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.package.outputs.runtime == 'true'
        with:
          name: Lummix-installed-runtime
          include-hidden-files: true
          path: |
            .build/qa/verified-runtime.json
            .build/qa/private-runtime-test.log
            .build/qa/profile-*.json
            .build/qa/profile-*.log
            .build/qa/msi-uninstall-*.log
            .build/qa/first-driver.*
            .build/qa/first-spotify.log
            .build/qa/upgrade.json
            .build/qa/shortcut-launch.json
