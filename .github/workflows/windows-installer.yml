name: Build and verify Windows installer
on:
  workflow_dispatch:
    inputs:
      compare_hybrid:
        description: Compare the real desktop and media service with the last hybrid installer
        type: boolean
        default: false
      comparison_build:
        description: Re-run measurements on the exact installer from an earlier successful build
        type: string
        required: false
permissions:
  contents: read
jobs:
  installer:
    if: inputs.comparison_build == ''
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Get the pinned installer compiler
        shell: pwsh
        run: |
          $file = Join-Path $env:RUNNER_TEMP 'nsis-tool.exe'
          $tools = Join-Path $env:RUNNER_TEMP 'nsis-tools'
          curl.exe -fLsS --retry 2 -o $file 'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.12/nsis-3.12-setup.exe'
          if ($LASTEXITCODE -ne 0) { throw 'NSIS download failed.' }
          if ((Get-FileHash $file).Hash -ne '3BC2B06253A7E4957111BE152AC6A536E0C7478A706E19DA814038DB5D706495') { throw 'NSIS hash mismatch.' }
          7z x -y "-o$tools" $file | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'NSIS extraction failed.' }
          "NSIS_COMPILER=$tools\makensis.exe" >> $env:GITHUB_ENV
      - name: Build Lummix Setup.exe
        shell: pwsh
        run: |
          python -m venv .venv
          ./scripts/build.ps1 -Python ./.venv/Scripts/python.exe -MakeNsis $env:NSIS_COMPILER
      - name: Install, verify the payload, repair and uninstall
        shell: pwsh
        run: |
          ./.venv/Scripts/python.exe -m pip install --only-binary=:all: -r windows/requirements-test.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./.venv/Scripts/python.exe windows/tests/verify_setup_exe.py "dist/Lummix Setup.exe" --silent
      - name: Exercise the Rust controller in the installed WebView2 runtime
        shell: pwsh
        run: |
          cargo test --release --locked --manifest-path windows/host-rs/Cargo.toml --target-dir .build/host --test webview_runtime -- --ignored --nocapture
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --release --locked --manifest-path windows/host-rs/Cargo.toml --target-dir .build/host --lib desktop_pumps_actual_webview_window_state_and_release_handshake -- --ignored --nocapture
      - name: Save the tested installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Lummix-Windows-x64
          path: dist/Lummix Setup.exe
          if-no-files-found: error

  compare:
    needs: installer
    if: ${{ !cancelled() && ((inputs.compare_hybrid && needs.installer.result == 'success') || (inputs.comparison_build != '' && needs.installer.result == 'skipped')) }}
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Retrieve and audit the two installer payloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          COMPARISON_BUILD: ${{ inputs.comparison_build }}
        run: |
          $build = $env:GITHUB_RUN_ID
          $source = $env:GITHUB_SHA
          if ($env:COMPARISON_BUILD) {
            if ($env:COMPARISON_BUILD -cnotmatch '\A[0-9]+\z') { throw 'Expected a numeric workflow run ID.' }
            $raw = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:COMPARISON_BUILD"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $run = $raw | ConvertFrom-Json
            if ($run.path -ne '.github/workflows/windows-installer.yml' -or $run.conclusion -ne 'success' -or
                $run.head_sha -cnotmatch '\A[0-9a-f]{40}\z') { throw 'Expected a successful installer build.' }
            $build = $env:COMPARISON_BUILD
            $source = $run.head_sha
          }
          gh run download 45868619780 --name Lummix-Windows-x64 --dir .build/before
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          gh run download $build --name Lummix-Windows-x64 --dir .build/after
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          python -m pip install --only-binary=:all: psutil==7.2.2 pywin32==312 playwright==1.63.0 tree-sitter==0.27.0 tree-sitter-rust==0.24.2
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          $after = '.build/after/Lummix Setup.exe'
          $hash = (Get-FileHash -LiteralPath $after).Hash.ToLowerInvariant()
          New-Item .build/results -ItemType Directory -Force | Out-Null
          python scripts/count-native-source.py --installer $after --sha256 $hash --commit $source --output .build/results/inventory.json
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          "CANDIDATE_HASH=$hash" >> $env:GITHUB_ENV
          "Comparing installer from run $build, commit $source, SHA-256 $hash" >> $env:GITHUB_STEP_SUMMARY
      - name: Measure media, setup and desktop startup
        shell: pwsh
        run: |
          Start-Service AudioEndpointBuilder
          Start-Service Audiosrv
          python -u windows/tests/bench_standalone.py --before '.build/before/Lummix Setup.exe' --after '.build/after/Lummix Setup.exe' --after-hash $env:CANDIDATE_HASH --output .build/results/comparison.json
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
      - name: Save measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Lummix-native-comparison
          path: .build/results/
          if-no-files-found: warn
