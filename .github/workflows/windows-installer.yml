name: Build and verify Windows installer
on: workflow_dispatch
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Get the pinned installer compiler
        shell: pwsh
        run: |
          $file = Join-Path $env:RUNNER_TEMP 'nsis-tool.exe'
          $tools = Join-Path $env:RUNNER_TEMP 'nsis-tools'
          curl.exe -fLsS --retry 2 -o $file 'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.12/nsis-3.12-setup.exe'
          if ($LASTEXITCODE -ne 0) { throw 'NSIS download failed.' }
          if ((Get-FileHash $file).Hash -ne '3BC2B06253A7E4957111BE152AC6A536E0C7478A706E19DA814038DB5D706495') { throw 'NSIS hash mismatch.' }
          7z x -y "-o$tools" $file | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'NSIS extraction failed.' }
          "NSIS_COMPILER=$tools\makensis.exe" >> $env:GITHUB_ENV
      - name: Build Lummix Setup.exe
        shell: pwsh
        run: |
          python -m venv .venv
          ./scripts/build.ps1 -Python ./.venv/Scripts/python.exe -MakeNsis $env:NSIS_COMPILER
      - name: Install, verify the payload, repair and uninstall
        shell: pwsh
        run: ./.venv/Scripts/python.exe windows/tests/verify_setup_exe.py "dist/Lummix Setup.exe" --silent
      - name: Exercise the Rust controller in the installed WebView2 runtime
        shell: pwsh
        run: |
          cargo test --release --locked --manifest-path windows/host-rs/Cargo.toml --target-dir .build/host --test webview_runtime -- --ignored --nocapture
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --release --locked --manifest-path windows/host-rs/Cargo.toml --target-dir .build/host --lib desktop_pumps_actual_webview_window_state_and_release_handshake -- --ignored --nocapture
      - name: Save the tested installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Lummix-Windows-x64
          path: dist/Lummix Setup.exe
          if-no-files-found: error
