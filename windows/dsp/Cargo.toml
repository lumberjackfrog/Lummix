[package]
name = "lummix-dsp"
version = "0.1.0"
edition = "2021"
publish = false

[features]
replay = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
crossbeam-queue = "=0.3.12"
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.58.0", features = ["implement", "Win32_Media_Audio", "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader", "Win32_System_Variant", "Win32_System_Threading", "Win32_Security", "Win32_UI_Shell_PropertiesSystem"] }
windows-core = "=0.58.0"

[profile.release]
panic = "abort"
