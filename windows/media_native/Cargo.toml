[package]
name = "lummix-media"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
serde_json = { version = "1", features = ["float_roundtrip"] }
windows = { version = "0.58", features = [
    "ApplicationModel", "Foundation", "Foundation_Collections", "Management_Deployment",
    "Media_Control", "Storage", "Storage_Streams", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp", "Win32_System_Ole", "Win32_System_Registry", "Win32_System_Threading",
    "Win32_System_WinRT", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
