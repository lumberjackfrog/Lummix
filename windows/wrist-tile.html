<style>
body *,body *::before,body *::after{transition:none!important;animation-duration:.001ms!important;animation-timing-function:step-end!important}
button,button *,button::before,button::after{animation:none!important;transition:none!important}
.button:hover,.button:active,.button:focus-visible,.performance-hardware-background:focus,.lum-companion button{transform:none!important}
.button:hover,.button:active{font-size:36px}
.lum-companion{position:absolute;left:8px;top:113px;z-index:100;display:grid;grid-template-columns:64px 40px;grid-template-rows:1fr 1fr;box-sizing:border-box;width:104px;height:180px;border-radius:23px;overflow:hidden;background:var(--theme-mid);color:var(--theme-contrasting);box-shadow:var(--drop-shadow)}
.lum-companion[hidden]{display:none!important}
.lum-companion button{position:relative;grid-column:1;display:grid;place-items:center;box-sizing:border-box;width:100%;height:100%;min-width:0;padding:0;margin:0;border:0;border-radius:0;background:var(--theme-mid);color:var(--theme-contrasting);cursor:pointer}
.lum-companion button+button{border-top:2px solid var(--theme-dark)}
.lum-companion button:hover,.lum-companion button:focus-visible{background:var(--theme-hi)}
.lum-companion button:focus-visible{outline:3px solid var(--theme-contrasting);outline-offset:-4px}
.lum-companion button[aria-pressed=true]{background:color-mix(in srgb,var(--theme-accent) 20%,var(--theme-mid));color:var(--theme-contrasting)}
.lum-companion button:disabled{opacity:.48}
.lum-companion button>span{position:static;display:grid;place-items:center;box-sizing:border-box;width:40px;height:40px;padding:0;margin:0;border:0;transform:none;align-self:center;justify-self:center;background:transparent;color:inherit}
.lum-companion .material-icons,.lum-companion .bi{font-size:35px;line-height:1}
.lum-companion .bi::before{vertical-align:0}
#lum-ref-music[aria-pressed=true]::after{content:"";position:absolute;left:50%;top:50%;width:43px;height:3px;border-radius:3px;background:currentColor;transform:translate(-50%,-50%) rotate(-45deg);box-shadow:0 -1.5px var(--theme-mid),0 1.5px var(--theme-mid);pointer-events:none}
.lum-volume{grid-column:2;grid-row:1/3;box-sizing:border-box;display:grid;grid-template-rows:minmax(0,1fr) 17px;justify-items:center;align-items:center;gap:6px;padding:11px 0 8px;border-left:2px solid var(--theme-dark);background:var(--theme-mid);color:var(--theme-contrasting)}
#lum-personal-level{all:revert;box-sizing:border-box;display:block;position:static;opacity:1;writing-mode:vertical-lr;direction:rtl;appearance:none;width:34px;height:100%;min-height:0;margin:0;padding:0;background:transparent;cursor:pointer}
#lum-personal-level:focus-visible{outline:2px solid var(--theme-contrasting);outline-offset:-2px;border-radius:6px}
#lum-volume-value{font:600 11px/1 system-ui,sans-serif;font-variant-numeric:tabular-nums;color:var(--theme-contrasting)}

/* Native JS caches (toolbarWidth - 500) / 2 at startup, including a hidden
   iframe's zero width. Center in the actual toolbar box once layout returns.
   The native performance panel intentionally uses a separate left-aligned layout. */
:root:not([data-lum-native-performance]) .ui-container > .wrist-container {
  left:50% !important;
  translate:-50% 0;
}

/* Surface, transport, contrast and blur follow the installed media drawer. */
.lum-companion {
  isolation:isolate;
  background:var(--lum-native-surface,var(--theme-mid));
  color:var(--lum-native-text,var(--theme-contrasting));
  backdrop-filter:var(--lum-native-filter,none);
  box-shadow:var(--lum-native-shadow,var(--drop-shadow));
}
.lum-companion.glass-backdrop {
  background:var(--lum-native-surface,rgba(255,255,255,.1));
}
.lum-companion.glass-backdrop::before {z-index:2;}
.lum-companion::after {
  content:"";position:absolute;inset:1px;z-index:-1;border-radius:inherit;pointer-events:none;
  background:linear-gradient(145deg,color-mix(in srgb,var(--lum-native-tint,transparent) 76%,transparent),var(--lum-native-tint,transparent));
}
.lum-companion button,.lum-volume {background:transparent;color:inherit;}
.lum-companion button+button,.lum-volume {
  border-color:color-mix(in srgb,currentColor 16%,transparent);
}
.lum-companion button:hover,.lum-companion button:focus-visible {
  background:var(--theme-hi);
  box-shadow:inset 0 0 0 2px var(--lum-control-accent,var(--theme-accent));
}
.lum-companion button:focus-visible {outline-color:var(--lum-control-accent,currentColor);}
.lum-companion button[aria-pressed=true] {
  background:var(--lum-control-accent,var(--theme-accent));
  color:var(--lum-control-ink,var(--theme-contrasting));
}
#lum-ref-music[aria-pressed=true]::after {
  box-shadow:0 -1.5px var(--lum-native-tint,var(--theme-mid)),0 1.5px var(--lum-native-tint,var(--theme-mid));
}
/* The approved native hit target is unchanged. Only the rail and transverse cap are skinned. */
#lum-personal-level {
  --lum-gain-rail: var(--lum-control-bed,var(--theme-dark));
  --lum-gain-fill: var(--lum-control-accent,var(--theme-accent));
  --lum-thumb-finish:
    repeating-linear-gradient(90deg,#fff0 0 2px,#fff2 2px 3px),
    linear-gradient(to bottom,
      #f4f4f3 0%,#e4e8eb 16%,#bbc1c7 40%,#8c949f 44%,
      #202b39 48%,#202b39 52%,#edf0f3 53%,#edf0f3 59%,
      #bbc1c7 69%,#8c949f 100%);
}
#lum-personal-level::-webkit-slider-runnable-track {
  width:6px;
  border-radius:5px;
  background:linear-gradient(to top,var(--lum-gain-fill) var(--lum-fill,50%),var(--lum-gain-rail) var(--lum-fill,50%));
  box-shadow:inset 0 0 0 1px #08090a78,0 0 0 1px color-mix(in srgb,currentColor 24%,transparent);
}
#lum-personal-level::-webkit-slider-thumb {
  appearance:none;
  box-sizing:border-box;
  width:24px;
  height:14px;
  margin-left:-9px;
  border:1px solid #c9d1db;
  border-radius:4px;
  background:var(--lum-thumb-finish);
  box-shadow:0 2px 4px #060815a3;
}
#lum-personal-level::-moz-range-track {
  width:6px;border-radius:5px;
  background:linear-gradient(to top,var(--lum-gain-fill) var(--lum-fill,50%),var(--lum-gain-rail) var(--lum-fill,50%));
  box-shadow:inset 0 0 0 1px #08090a78;
}
#lum-personal-level::-moz-range-thumb {
  box-sizing:border-box;
  width:24px;height:14px;border:1px solid #c9d1db;border-radius:4px;
  background:var(--lum-thumb-finish);
  box-shadow:0 2px 4px #060815a3;
}
#lum-personal-level:focus-visible,#lum-volume-value {color:var(--lum-native-text,var(--theme-contrasting));}
#lum-personal-level:focus-visible {outline-color:var(--lum-gain-fill);}
:root[data-lum-pinned-art] .wrist-container img.background-image,
:root[data-lum-pinned-art] .wrist-container .background-image-fader {opacity:1!important;}
:root[data-lum-pinned-art] .wrist-container .background-image-fader {
  background:linear-gradient(145deg,var(--theme-mid) 20%,transparent 100%)!important;
}
.lum-wrist-pulse {
  position:absolute;inset:0;border-radius:inherit;z-index:3;pointer-events:none;opacity:0;
  box-shadow:inset 0 0 0 2px var(--lum-control-accent,var(--theme-accent)),
             inset 0 0 16px color-mix(in srgb,var(--lum-control-accent,var(--theme-accent)) 56%,transparent);
  transition:opacity 560ms ease-out!important;
}
@media(prefers-reduced-motion:reduce){.lum-wrist-pulse{display:none;}}
</style>
<div class="lum-companion" role="group" aria-label="Lummix audio controls" hidden>
 <span class="lum-wrist-pulse" aria-hidden="true"></span>
 <button type="button" id="lum-ref-mute" aria-label="Mute microphone" title="Mute microphone" aria-pressed="false" disabled><span class="material-icons" mIcon="mic" aria-hidden="true"></span></button>
 <button type="button" id="lum-ref-music" aria-label="Mute personal Spotify playback" title="Mute personal Spotify playback" aria-pressed="false" disabled><span class="bi bi-music-note-beamed" aria-hidden="true"></span></button>
 <label class="lum-volume" title="Lummix music output gain"><input type="range" id="lum-personal-level" aria-label="Music output gain" aria-orientation="vertical" min="0" max="200" value="100"><output id="lum-volume-value" for="lum-personal-level">100%</output></label>
</div>
<style>.media-widget-button:disabled {opacity:.36;cursor:default;pointer-events:none;}</style>
