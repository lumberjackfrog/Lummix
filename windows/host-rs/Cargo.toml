[package]
name = "lummix-host"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "lummix-host-cli"
path = "src/main.rs"

[dependencies]
tiny_http = "=0.12.0"

[target.'cfg(windows)'.dependencies]
base64 = "=0.22.1"
httparse = "=1.10.1"
regex = "=1.12.3"
serde_core = "=1.0.229"
serde_json = { version = "=1.0.154", features = ["arbitrary_precision", "raw_value"] }
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_System_Com",
    "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader", "Win32_System_Ole",
    "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "=0.59.0", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "=0.55.0"
